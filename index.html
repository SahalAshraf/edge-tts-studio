<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google TTS Vercel Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-white flex items-center justify-center gap-2">
        <i class="fa-solid fa-volume-high text-blue-400"></i> Google TTS Studio
      </h1>
      <p class="text-xs text-slate-400 mt-1">Powered by Vercel Serverless & gTTS</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Language</label>
        <select id="langSelect" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-slate-200">
          <option value="en">English (en)</option>
          <option value="hi">Hindi (hi)</option>
          <option value="ur">Urdu (ur)</option>
          <option value="es">Spanish (es)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Text to Convert</label>
        <textarea id="textInput" rows="4" class="w-full p-3.5 bg-slate-950 border border-slate-700 rounded-2xl text-sm text-slate-200 resize-none">Hello! This is a serverless text-to-speech converter deployed on Vercel.</textarea>
      </div>

      <button id="synthBtn" onclick="generateAudio()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate & Play MP3
      </button>
    </div>

    <div id="statusDiv" class="mt-4 text-center text-xs text-slate-400">Ready</div>

    <div id="resultBox" class="mt-4 p-4 bg-slate-950 border border-slate-800 rounded-xl text-center hidden">
      <audio id="audioPlayer" controls class="w-full mb-3"></audio>
      <a id="downloadLink" download="speech.mp3" class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2 px-4 rounded-lg transition">
        <i class="fa-solid fa-download mr-1"></i> Download MP3
      </a>
    </div>
  </div>

  <script>
    async function generateAudio() {
      const text = document.getElementById('textInput').value.trim();
      const lang = document.getElementById('langSelect').value;
      const statusDiv = document.getElementById('statusDiv');
      const synthBtn = document.getElementById('synthBtn');
      const resultBox = document.getElementById('resultBox');
      const audioPlayer = document.getElementById('audioPlayer');
      const downloadLink = document.getElementById('downloadLink');

      if (!text) {
        statusDiv.innerText = "Please enter text.";
        return;
      }

      synthBtn.disabled = true;
      synthBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Generating...`;
      statusDiv.innerText = "Processing request...";
      resultBox.classList.add('hidden');

      try {
        const response = await fetch(`/synthesize?text=${encodeURIComponent(text)}&lang=${lang}`);
        if (!response.ok) throw new Error("Failed to generate audio from server.");

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);

        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;

        statusDiv.innerText = "Success!";
        resultBox.classList.remove('hidden');
        audioPlayer.play();
      } catch (err) {
        statusDiv.innerText = `Error: ${err.message}`;
      } finally {
        synthBtn.disabled = false;
        synthBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Generate & Play MP3`;
      }
    }
  </script>
</body>
</html>
